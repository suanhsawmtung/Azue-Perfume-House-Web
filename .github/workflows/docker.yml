name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev

env:
  DOCKER_TAG: ${{ github.ref_name == 'main' && 'production' || github.ref_name == 'dev' && 'staging' || github.ref_name }}
  DOCKER_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/azue-perfume-house-web

jobs:
  build:
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          IMAGE=${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
          echo "Building ${IMAGE}"
          docker build \
            --build-arg VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}" \
            --build-arg VITE_BASE_IMAGE_URL="${{ vars.VITE_BASE_IMAGE_URL }}" \
            --build-arg VITE_CURRENCY="${{ vars.VITE_CURRENCY }}" \
            --build-arg VITE_BASE_URL="${{ vars.VITE_BASE_URL }}" \
            --build-arg VITE_APP_ENV="${{ vars.VITE_APP_ENV }}" \
            -t "${IMAGE}" .

      - name: Push Docker image
        run: |
          IMAGE=${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
          echo "Pushing ${IMAGE}"
          docker push "${IMAGE}"

      - name: Redeploy on Render
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

      # - name: Redeploy on Railway
      #   run: npx -y @railway/cli@latest redeploy --service "$RAILWAY_SERVICE_NAME" --yes
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #     RAILWAY_SERVICE_NAME: ${{ secrets.RAILWAY_SERVICE_NAME }}
